
name: Assignment Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests and create JSON report
        id: tests
        run: |
          python -m pytest -v --json-report --json-report-file=pytest-report.json

      - name: Send test report to local computer
        if: always()
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: python send_report.py
